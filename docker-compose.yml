services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: intel_backend
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: intel_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy